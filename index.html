<!DOCTYPE html>
<!--
  Módulo: Interfaz de conversación (página)
  Responsabilidad: estructura de la página: formulario de nuevo comentario con su zona de
    mensajes, y la lista de comentarios con su contador.
  Decisiones: D-07, D-13
  Requisitos: RN-010 · F-COM-001 · F-COM-002
  Fronteras: carga css/style.css y js/conversacion.js.
  Estado: andamiaje — la lista no se carga hasta que exista la lógica.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Comentarios</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>App de Comentarios</h1>
            <p class="subtitle">Ejercicio de Vibe Coding — Semana 1</p>
        </header>

        <main>
            <section class="comment-form">
                <h2>Nuevo comentario</h2>
                <form id="commentForm">
                    <div id="mensajesComentario" class="form-messages" aria-live="polite"></div>
                    <div class="form-group">
                        <label for="author">Nombre:</label>
                        <input type="text" id="author" name="author" placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="content">Comentario:</label>
                        <textarea id="content" name="content" placeholder="Escribí tu comentario..." rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Publicar</button>
                </form>
            </section>

            <section class="comments-list">
                <h2>Comentarios <span id="commentCount">(0)</span></h2>
                <div id="commentsContainer">
                    <p class="loading">Cargando comentarios...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Trayecto: Arquitectos de Orquestación e Ingeniería IA — Semana 1</p>
        </footer>
    </div>

    <script src="js/conversacion.js"></script>
</body>
</html>
